name: Release

# Builds, tests, signs and publishes a release of Grab.
#
#   • Push a tag:        git tag v1.4.0 && git push origin v1.4.0
#   • Or from GitHub:    Actions → Release → Run workflow → version 1.4.0
#
# The release gets Grab-x.y.z.dmg (to download) and Grab-x.y.z.zip (what Grab's built-in
# updater installs). Both are signed with the "Grab Release" key, which every copy of Grab
# trusts for updates.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   GRAB_RELEASE_P12           the Grab Release key (.p12), base64-encoded
#   GRAB_RELEASE_P12_PASSWORD  its password
#   TAP_TOKEN                  (optional) a token that can push to 0x1p0/homebrew-tap, to update the cask

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.4.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${INPUT#v}"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::'$V' isn't a version like 1.4.0"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Test
        run: swift test

      - name: Build and sign
        env:
          P12: ${{ secrets.GRAB_RELEASE_P12 }}
          GRAB_RELEASE_P12_PASSWORD: ${{ secrets.GRAB_RELEASE_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::The GRAB_RELEASE_P12 secret isn't set, so the release can't be signed."
            exit 1
          fi
          export GRAB_RELEASE_P12="$RUNNER_TEMP/grab-release.p12"
          echo "$P12" | base64 --decode > "$GRAB_RELEASE_P12"
          scripts/release.sh "${{ steps.version.outputs.version }}"
          rm -f "$GRAB_RELEASE_P12"

      - name: Check the signature
        run: |
          APP=build/Grab.app
          codesign --verify --strict --deep "$APP"
          codesign --verify -R='identifier "com.thirteen.Grab" and certificate root = H"3f7a72209f972742d7f85825176396efc194da89"' "$APP"
          test "$(defaults read "$PWD/$APP/Contents/Info" CFBundleShortVersionString)" = "${{ steps.version.outputs.version }}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$V" "dist/Grab-$V.dmg" "dist/Grab-$V.zip" \
            --target "$GITHUB_SHA" --title "Grab $V" --generate-notes

      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.TAP_TOKEN }}
        run: scripts/publish-tap.sh "${{ steps.version.outputs.version }}"
